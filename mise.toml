# Omarchy feature-dev workspace.
# Quick start: mise setup → mise worktree → mise test [tree] → mise rebase when needed.
# Wrappers on PATH via [env] when you cd here (Omarchy activates mise).

min_version = "2026.10.19"

[env]
_.path = ["bin"]
OMARCHY_DEV_ROOT = "{{config_root}}"

# Load mise tab completion into the current shell on enter (bash or zsh).
[[hooks.enter]]
shell = "zsh"
script = '''
if ! (( $+functions[_mise] )); then
  if ! (( $+functions[compdef] )); then
    autoload -Uz compinit
    compinit -i
  fi
  eval "$(command mise completion zsh)"
fi
'''

[[hooks.enter]]
shell = "bash"
script = 'complete -p mise &>/dev/null || eval "$(command mise completion bash)"'

[bootstrap.packages]
"pacman:qemu-full" = "latest"
"pacman:edk2-ovmf" = "latest"
"pacman:socat" = "latest"
"pacman:imagemagick" = "latest"
"pacman:tesseract" = "latest"
"pacman:tesseract-data-eng" = "latest"
"pacman:jq" = "latest"
"pacman:curl" = "latest"

[tasks.setup]
description = "Prepare workspace (packages, clones, ISO, base image)"
raw_args = true
usage = '''
flag "--no-iso" help="Skip ISO download"
flag "--no-base" help="Skip base image"
flag "--no-packages" help="Skip mise bootstrap packages apply"
flag "--channel <channel>" help="ISO channel" default="edge" {
  choices "edge" "stable"
}
'''
run = "bin/omarchy-dev-setup"

# Named "health" — `mise doctor` is a built-in mise command.
[tasks.health]
description = "Check host tools, clones, harness patch, ISO, base image"
raw_args = true
run = "bin/omarchy-dev-doctor"

[tasks.test]
description = "Boot interactive VM on current base image (stock or worktree); left running unless --run-tests"
raw_args = true
usage = '''
arg "[tree]" help="Worktree name/path; omit for stock"
complete "tree" run="command ls -1 worktrees"
flag "--graphical" help="QEMU window (default)"
flag "--ssh" help="Headless (no window)"
flag "--grab-kbd" help="Keyboard grab on (default)"
flag "--no-grab-kbd" help="Do not grab the host keyboard"
flag "--run-tests" help="Run automated checks, then stop the VM"
flag "--host-config" help="Copy selected host ~/.config dirs into the guest (interactive only)"
'''
run = "bin/omarchy-dev-test"

[tasks.rebase]
description = "Rebuild shared base image"
raw_args = true
usage = '''
arg "[target]" help="list | status | edge | stable | rc | version | ISO name/path; omit to pick interactively"
'''
run = "bin/omarchy-dev-rebase"

[tasks.worktree]
description = "Manage feature worktrees under worktrees/"
raw_args = true
usage = '''
arg "<action>" help="list | add | remove" {
  choices "list" "add" "remove"
}
arg "[name]" help="Worktree name (add / remove)"
arg "[start]" help="Start point for add (default: quattro)"
'''
run = "bin/omarchy-dev-worktree"
